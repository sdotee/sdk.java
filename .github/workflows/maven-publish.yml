name: Maven Package

on:
  release:
    types: [created]
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"
          server-id: github # references the server id in pom.xml

      - name: Build with Maven
        run: mvn -B verify --file pom.xml

      - name: Publish to GitHub Packages
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        run: mvn -B deploy -DskipTests -Dgpg.skip --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
